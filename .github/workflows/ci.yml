# Every push and pull request: the server tests, the type check and the build must pass.
# (The screen smoke test, npm run e2e, needs a browser: run it on your computer before making the pendrive.)
name: CI
on:
  push:
    branches: [main, web-app]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
