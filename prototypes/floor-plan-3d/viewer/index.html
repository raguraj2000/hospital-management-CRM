<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>First Floor 3D</title>
<meta name="description" content="Walkable 3D model of First Floor Plan v5 (main entrance south, road on the west).">
<style>
  :root {
    --bg: #0f1214; --panel: rgba(18, 22, 26, 0.78); --text: #eef1f3; --muted: #a8b0b6;
    --accent: #e0a458; --line: rgba(255, 255, 255, 0.14);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font: 14px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .panel { position: fixed; background: var(--panel); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: 12px; }
  #hud { top: max(12px, env(safe-area-inset-top)); left: 12px; padding: 10px 12px; max-width: min(320px, 60vw); }
  #hud h1 { font-size: 13px; margin: 0 0 4px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
  #room { font-size: 17px; font-weight: 650; }
  #size { color: var(--accent); font-variant-numeric: tabular-nums; }
  #mapwrap { top: max(12px, env(safe-area-inset-top)); right: 12px; padding: 6px; }
  #map { display: block; width: 200px; height: 200px; cursor: crosshair; touch-action: none; }
  #bar { left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom)); padding: 6px;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 24px); }
  button, select { font: inherit; color: var(--text); background: rgba(255,255,255,0.08); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; min-height: 40px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: #1a1208; border-color: transparent; font-weight: 600; }
  select { max-width: 190px; }
  select option { background: #1b2025; }
  #help { bottom: calc(max(12px, env(safe-area-inset-bottom)) + 64px); left: 50%; transform: translateX(-50%);
    padding: 8px 12px; color: var(--muted); font-size: 12.5px; text-align: center; max-width: calc(100vw - 24px); }
  #labels { position: fixed; inset: 0; pointer-events: none; }
  .lbl { position: absolute; transform: translate(-50%, -50%); background: rgba(15, 18, 20, 0.72); color: #fff;
    padding: 3px 7px; border-radius: 6px; font-size: 12px; white-space: nowrap; pointer-events: auto; cursor: pointer;
    border: 1px solid var(--line); }
  .lbl small { color: var(--accent); margin-left: 4px; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 5; }
  #loading .box { width: min(320px, 80vw); text-align: center; }
  #prog { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 10px; }
  #prog div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  #joy { position: fixed; width: 110px; height: 110px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35);
    background: rgba(255,255,255,.06); display: none; pointer-events: none; transform: translate(-50%, -50%); }
  #joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    background: rgba(255,255,255,.55); }
  #cross { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    background: rgba(255,255,255,.7); pointer-events: none; }
  @media (max-width: 640px) {
    #map { width: 132px; height: 132px; }
    #hud { max-width: calc(100vw - 180px); }
    #room { font-size: 15px; }
    button, select { padding: 6px 9px; min-height: 38px; font-size: 13px; }
    select { max-width: 112px; }
    #bar { flex-wrap: nowrap; }
    #hud h1 { display: none; }
    #help { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="cross"></div>
<div id="hud" class="panel">
  <h1>FIRST FLOOR v5 · entrance faces south · road on the west</h1>
  <div id="room">Loading…</div>
  <div id="size"></div>
</div>
<div id="mapwrap" class="panel"><canvas id="map" width="400" height="400" aria-label="Floor plan minimap, tap to move there"></canvas></div>
<div id="help" class="panel"></div>
<div id="bar" class="panel">
  <button id="bWalk" aria-pressed="true">Walk</button>
  <button id="bOver" aria-pressed="false">Overview</button>
  <select id="goto" aria-label="Go to"></select>
  <button id="bHQ" aria-pressed="true" title="Ambient occlusion + sun shadows">HQ</button>
</div>
<div id="joy"><i></i></div>
<div id="loading"><div class="box"><div>Loading 3D model…</div><div id="prog"><div></div></div></div></div>
<script type="module" src="app.js"></script>
</body>
</html>
